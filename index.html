<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cosmic Values Admin Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Cosmic Values Admin Panel</h1>

  <h2>Scrape Game.Guide</h2>
  <button id="scrapeBtn">Scrape Game.Guide</button>

  <h2>Manual Update</h2>
  <input id="name" placeholder="Item Name (required)">
  <input id="category" placeholder="Category (required)">
  <input id="price" placeholder="Price Display (required)">
  <input id="demand" placeholder="Demand (required)">
  <input id="status" placeholder="Status (required)">
  <input id="thumb" placeholder="Thumbnail URL">
  <input id="by" placeholder="Updated By">
  <button id="saveBtn">Save Item</button>

  <pre id="output"></pre>

  <script src="script.js"></script>
</body>
</html>
